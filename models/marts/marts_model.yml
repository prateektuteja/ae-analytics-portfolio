
models:

  - name: fct_orders

    columns:

      - name: customer_id

        tests:

          - relationships:

              to: ref('dim_customers')

              field: customer_id

      - name: order_status

        tests:

          - not_null

          - accepted_values:

              values:

                - shipped

                - delivered

                - created

                - approved

                - unavailable

                - invoiced

                - processing

                - canceled

  - name: fct_order_items

    columns:

      - name: product_id

        tests:

          - relationships:

              to: ref('dim_products')

              field: product_id

      - name: seller_id

        tests:

          - relationships:

              to: ref('dim_sellers')

              field: seller_id

      - name: order_id

        tests:

          - relationships:

              to: ref('fct_orders')

              field: order_id

  - name: dim_customers

    columns:

      - name: customer_id

        tests:

          - unique

          - not_null

  - name: dim_sellers

    columns:

      - name: seller_id

        tests:

          - unique

          - not_null

  - name: dim_products

    columns:

      - name: product_id

        tests:

          - unique

          - not_null
