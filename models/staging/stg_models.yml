version: 2

models:
  - name: stg_orders
    description: "Confirmed order_id is a true unique key (no duplicates found via profiling). order_approved_at, order_delivered_carrier_date, and order_delivered_customer_date have expected nulls (160/1,783/2,965 rows) — orders that haven't reached that lifecycle stage (pending/cancelled/undelivered), not a data defect."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: order_status
        tests: [not_null]

  - name: stg_customers
    description: "Confirmed customer_id is a true unique key. Profiled customer_city/customer_state for casing inconsistency — none found (clean)."
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_city
        tests: [not_null]
      - name: customer_state
        tests: [not_null]

  - name: stg_products
    description: "Confirmed product_id is a true unique key (no duplicates found via profiling). 610 products are missing category/description metadata entirely (product_category_name, product_name_lenght, product_description_lenght, product_photos_qty all null together) — incomplete seller-submitted listings, not a pipeline defect. 2 products separately missing physical dimensions."
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_payments
    description: "Composite key (order_id, payment_sequential) — a native single-column unique test doesn't apply. Composite uniqueness test deferred to Day 8 (dbt_utils.unique_combination_of_columns). Profiling confirmed no nulls in any column."
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_sequential
        tests: [not_null]
      - name: payment_type
        tests: [not_null]
      - name: payment_value
        tests: [not_null]

  - name: stg_reviews
    description: "Grain is one row per (review_id, order_id) — review_id alone is NOT unique. Confirmed via profiling: Olist attaches the same review_id/creation_date to multiple order_ids when orders are bundled. Composite uniqueness test deferred to Day 8. review_comment_title and review_comment_message are expected to be null on most rows (88% and 59% respectively) — not every customer leaves written feedback."
    columns:
      - name: review_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]
      - name: review_score
        tests: [not_null]

  - name: stg_sellers
    description: "Confirmed seller_id is a true unique key. Profiled seller_city/seller_state for casing inconsistency — none found (clean)."
    columns:
      - name: seller_id
        tests: [unique, not_null]
      - name: seller_city
        tests: [not_null]
      - name: seller_state
        tests: [not_null]

  - name: stg_order_items
    description: "Composite key (order_id, order_item_id) — native single-column unique test doesn't apply. Composite uniqueness test deferred to Day 8. Profiling confirmed no nulls in any column."
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_item_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: seller_id
        tests: [not_null]
      - name: price
        tests: [not_null]

  - name: stg_product_category_translation
    description: "Small lookup table (71 rows). Confirmed product_category_name is a true unique key via profiling."
    columns:
      - name: product_category_name
        tests: [unique, not_null]
      - name: product_category_name_english
        tests: [not_null]
