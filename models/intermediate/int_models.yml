models:
- name: int_order_items_summary
  columns:
  - name: order_id
    tests:
    - unique
    - not_null
- name: int_order_payments
  columns:
  - name: order_id
    tests:
    - unique
    - not_null
- name: int_order_reviews
  columns:
  - name: order_review_id
    tests:
    - unique
    - not_null
- name: int_order_items
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - order_id
        - order_item_id
  columns:
  - name: order_id
    tests:
    - not_null
  - name: order_item_id
    tests:
    - not_null
